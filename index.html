<style>
:root{
  --panel:rgba(244,238,224,.93);
  --ink:#2b2216;
  --muted:#6a5a44;
  --accent:#2f5236;
  --accent-ink:#f4efe2;
  --ochre:#a8762a;
  --line:rgba(60,42,20,.16);
  --shadow:0 10px 30px rgba(40,25,10,.22);
  --bg:#c9d6dc;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --panel:rgba(30,26,20,.92);--ink:#efe6d4;--muted:#b8a789;--accent:#7fae84;--accent-ink:#13180f;
    --ochre:#d9a556;--line:rgba(255,235,200,.14);--shadow:0 10px 30px rgba(0,0,0,.5);--bg:#1b1916;
  }
}
:root[data-theme="dark"]{
  --panel:rgba(30,26,20,.92);--ink:#efe6d4;--muted:#b8a789;--accent:#7fae84;--accent-ink:#13180f;
  --ochre:#d9a556;--line:rgba(255,235,200,.14);--shadow:0 10px 30px rgba(0,0,0,.5);--bg:#1b1916;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}

.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;
  display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.brand{pointer-events:auto;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:14px;padding:9px 14px 10px;box-shadow:var(--shadow);max-width:62vw}
.brand h1{font-family:'Alegreya',Georgia,serif;font-weight:700;font-size:20px;line-height:1.1;margin:0;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.25}
.ctrls{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}
.seg{display:flex;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.pill{border:0;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:9px 14px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
#compass{width:42px;height:42px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);position:relative}
#needle{position:absolute;inset:0;transition:none}
#needle::before{content:"";position:absolute;left:50%;top:7px;width:0;height:0;transform:translateX(-50%);
  border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:13px solid #a3342a}
#needle::after{content:"";position:absolute;left:50%;bottom:7px;width:0;height:0;transform:translateX(-50%);
  border-left:6px solid transparent;border-right:6px solid transparent;border-top:13px solid var(--muted)}
#needle span{position:absolute;left:50%;top:-15px;transform:translateX(-50%);font-weight:700;font-size:12px;
  color:var(--ink);text-shadow:0 0 3px var(--panel)}

#card{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);margin:0 auto;max-width:560px;
  background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px;
  box-shadow:var(--shadow);padding:14px 16px 12px;z-index:5}
.cardhead{display:flex;align-items:center;gap:10px}
#stopNum{font-weight:700;color:var(--ochre);font-size:14px;min-width:38px}
#stopTitle{font-family:'Alegreya',Georgia,serif;font-size:21px;line-height:1.15;margin:0;flex:1}
#cardToggle{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--muted);flex:none}
#cardToggle:hover{background:var(--line)}
#stopText{font-size:15.5px;line-height:1.5;margin-top:6px;max-height:30vh;overflow:auto}
#stopText p{margin:0 0 6px}
#stopText .note{color:var(--muted);font-size:14px}
#stopText ol{margin:2px 0 6px;padding-left:0;list-style:none}
#stopText li{display:flex;gap:10px;padding:2px 0}
#stopText li b{color:var(--ochre);min-width:38px}
nav.tour{display:flex;align-items:center;gap:8px;margin-top:10px}
nav.tour button{border:0;background:var(--line);padding:9px 14px;border-radius:12px;font-weight:700;font-size:15px}
nav.tour button.primary{background:var(--accent);color:var(--accent-ink)}
nav.tour button:disabled{opacity:.35;cursor:default}
#dots{flex:1;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
#dots button{width:9px;height:9px;padding:0;border-radius:50%;background:var(--line);border:0}
#dots button.on{background:var(--ochre);transform:scale(1.25)}
#card.min #stopText,#card.min nav.tour{display:none}
#card.walk nav.tour{display:none}

#joy{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);width:118px;height:118px;border-radius:50%;
  background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);display:none;z-index:6;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(0,0,0,.25)}
body.walking #joy{display:block}
body.walking.nojoy #joy{display:none}

#loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;transition:opacity .6s}
#loader div{font-family:'Alegreya',Georgia,serif;font-size:20px;color:var(--ink)}
#loader.gone{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#loader{transition:none}}
@media (max-width:420px){.brand h1{font-size:18px}.brand p{font-size:12px}#stopTitle{font-size:19px}}
</style>

<body>
<div id="stage"></div>

<header class="top">
  <div class="brand">
    <h1>Hrádek Bučovice</h1>
    <p>Kalvárie (Hradisko), 2. pol. 13. až 14. století</p>
  </div>
  <div class="ctrls">
    <div class="seg" id="eraSeg" role="group" aria-label="Období">
      <button data-era="past" class="on">Kolem 1300</button>
      <button data-era="today">Dnes</button>
    </div>
    <button id="modeBtn" class="pill">🚶 Projít se</button>
    <div id="compass" aria-hidden="true"><div id="needle"><span>S</span></div></div>
  </div>
</header>

<section id="card" aria-live="polite">
  <div class="cardhead">
    <span id="stopNum">1/9</span>
    <h2 id="stopTitle">Hrádek na Kalvárii</h2>
    <button id="cardToggle" aria-label="Sbalit popis">▾</button>
  </div>
  <div id="stopText"></div>
  <nav class="tour">
    <button id="prev">‹ Zpět</button>
    <div id="dots"></div>
    <button id="next" class="primary">Dál ›</button>
  </nav>
</section>

<div id="joy"><div id="knob"></div></div>
<div id="loader"><div>Stavím palisádu…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const isTouch = window.matchMedia && matchMedia('(pointer:coarse)').matches;
const $ = s => document.querySelector(s);
const D2R = Math.PI/180;

/* ---------- random & noise ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rng = mulberry(1322);
const rr = (a,b)=>a+(b-a)*rng();
function hash(x,z){const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  const a=hash(xi,zi),b=hash(xi+1,zi),c=hash(xi,zi+1),d=hash(xi+1,zi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,z){let f=0,a=.5,fr=1;for(let i=0;i<4;i++){f+=a*vnoise(x*fr,z*fr);fr*=2.03;a*=.5;}return f/.9375;}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

/* ---------- site geometry (metres; north = -z, east = +x) ---------- */
const GATE = 40;        // bearing of gate (access from N/NE)
const PAL_R = 28;       // palisade on rampart crest
const WALK_R = 26.6;
function bxz(b,r){return [Math.sin(b*D2R)*r, -Math.cos(b*D2R)*r];}
function bearingOf(x,z){let b=Math.atan2(x,-z)/D2R;return (b+360)%360;}
function angDiff(a,b){let d=((a-b)%360+540)%360-180;return d;}

function prof(r){
  let h=18;
  h+=1.2*ss(23,27.5,r)*(1-ss(29,32.5,r));   // rampart (val)
  h-=5.0*ss(30.5,39,r);                     // ditch, ~23 m wide
  h+=3.0*ss(46,53.5,r);                     // outer bank
  h-=16*ss(56,175,r);                       // hill slope
  return h;
}
function H(x,z){
  const r=Math.hypot(x,z);
  let h=prof(r);
  const t=ss(60,220,r);
  h-=t*z*0.035;                                       // terrain falls to the town in the south
  h+=(fbm(x*.012+3,z*.012+7)-.5)*14*ss(70,200,r);     // rolling land
  h+=(fbm(x*.18,z*.18)-.5)*.35*ss(5,20,r);            // micro relief
  return h;
}
function pathDist(x,z,r){
  if(r<54||r>300) return Infinity;
  const b=GATE+(r-55)*0.28;
  return Math.abs(angDiff(bearingOf(x,z),b))*D2R*r;
}

/* ---------- renderer / scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, isTouch?1.6:2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('#stage').appendChild(renderer.domElement);

const scene=new THREE.Scene();
const HORIZON=0xdde5e6;
scene.background=new THREE.Color(HORIZON);
scene.fog=new THREE.Fog(HORIZON,260,1150);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.25,3000);
camera.position.set(-78,64,92);

const hemi=new THREE.HemisphereLight(0xd6e6ff,0x5d5233,.72);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d2,1.0);
sun.position.set(-110,150,90);sun.target.position.set(0,15,0);
sun.castShadow=true;
const SM=isTouch?1024:2048;sun.shadow.mapSize.set(SM,SM);
Object.assign(sun.shadow.camera,{left:-72,right:72,top:72,bottom:-72,near:20,far:420});
sun.shadow.bias=-.0006;sun.shadow.normalBias=.4;
scene.add(sun);scene.add(sun.target);

/* sky dome */
{
  const g=new THREE.SphereGeometry(2400,32,16);
  const m=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
    uniforms:{top:{value:new THREE.Color(0x5f93cf)},hor:{value:new THREE.Color(HORIZON)}},
    vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'uniform vec3 top;uniform vec3 hor;varying vec3 vP;void main(){float h=clamp(vP.y,0.,1.);gl_FragColor=vec4(mix(hor,top,pow(h,.55)),1.);}'});
  const sky=new THREE.Mesh(g,m);sky.renderOrder=-1;scene.add(sky);
}

/* ---------- procedural textures ---------- */
function canvasTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g,w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;}
function rep(t,x,y){const c=t.clone();c.needsUpdate=true;c.repeat.set(x,y);return c;}

const woodTex=canvasTex(256,256,(g,w,h)=>{
  for(let x=0;x<w;x+=32){const l=36+rng()*14;g.fillStyle=`hsl(32,${18+rng()*10}%,${l}%)`;g.fillRect(x,0,32,h);
    for(let k=0;k<24;k++){g.strokeStyle=`rgba(40,24,10,${.07+rng()*.13})`;g.lineWidth=1;g.beginPath();const xx=x+rng()*32;
      g.moveTo(xx,0);g.bezierCurveTo(xx+rr(-2,2),h*.33,xx+rr(-2,2),h*.66,xx+rr(-1.5,1.5),h);g.stroke();}
    g.fillStyle='rgba(18,10,4,.55)';g.fillRect(x,0,2,h);
    if(rng()<.5){g.fillStyle='rgba(30,18,8,.5)';g.beginPath();g.ellipse(x+rr(8,24),rr(20,230),2.5,4,0,0,7);g.fill();}}
});
const daubTex=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#cdbb98';g.fillRect(0,0,w,h);
  for(let i=0;i<2600;i++){g.fillStyle=`rgba(${rng()<.5?90:250},${rng()<.5?70:235},${rng()<.5?40:200},${rng()*.09})`;g.fillRect(rng()*w,rng()*h,rr(1,5),rr(1,5));}
  for(let i=0;i<10;i++){g.strokeStyle='rgba(110,85,55,.25)';g.lineWidth=rr(1,3);g.beginPath();const y=rng()*h;g.moveTo(0,y);g.lineTo(w,y+rr(-20,20));g.stroke();}
  g.fillStyle='#5a4128';[0,124,w-10].forEach(x=>g.fillRect(x,0,10,h));g.fillRect(0,0,w,9);g.fillRect(0,h-12,w,12);
  g.fillStyle='rgba(30,20,10,.25)';[10,134].forEach(x=>g.fillRect(x,0,2,h));
});
const thatchTex=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#8f7742';g.fillRect(0,0,w,h);
  for(let i=0;i<5200;i++){const x=rng()*w,y=rng()*h,l=rr(8,22);const v=rng();
    g.strokeStyle=v<.33?'rgba(60,45,20,.45)':v<.66?'rgba(185,160,100,.4)':'rgba(130,108,60,.5)';
    g.lineWidth=rr(.6,1.6);g.beginPath();g.moveTo(x,y);g.lineTo(x+rr(-2,2),y+l);g.stroke();}
  for(let y=0;y<h;y+=32){g.fillStyle='rgba(50,35,15,.18)';g.fillRect(0,y,w,3);}
});
const shingleTex=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#4b4134';g.fillRect(0,0,w,h);
  for(let y=0,row=0;y<h;y+=16,row++){let x=row%2?-9:0;
    while(x<w){const sw=rr(12,20);const l=26+rng()*16;g.fillStyle=`hsl(${28+rng()*10},${10+rng()*10}%,${l}%)`;
      g.fillRect(x+1,y+1,sw-2,15);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x+1,y+13,sw-2,3);x+=sw;}}
});
const stoneTex=canvasTex(256,128,(g,w,h)=>{
  g.fillStyle='#6d6a62';g.fillRect(0,0,w,h);
  for(let y=0,row=0;y<h;y+=18,row++){let x=row%2?-14:0;
    while(x<w){const sw=rr(20,34);const l=42+rng()*16;g.fillStyle=`hsl(40,${4+rng()*6}%,${l}%)`;
      g.beginPath();g.roundRect?g.roundRect(x+2,y+2,sw-3,15,4):g.rect(x+2,y+2,sw-3,15);g.fill();x+=sw;}}
});
const detailTex=canvasTex(128,128,(g,w,h)=>{
  g.fillStyle='#e8e8e8';g.fillRect(0,0,w,h);
  for(let i=0;i<1800;i++){const v=rng();g.fillStyle=v<.5?`rgba(0,0,0,${rng()*.14})`:`rgba(255,255,255,${rng()*.2})`;g.fillRect(rng()*w,rng()*h,rr(1,3),rr(1,3));}
});
function softTex(blobs){return canvasTex(128,128,(g,w,h)=>{
  for(let i=0;i<blobs;i++){const x=blobs>1?rr(30,98):64,y=blobs>1?rr(45,85):64,r=blobs>1?rr(18,34):60;
    const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr;g.fillRect(0,0,w,h);}});}
const smokeTex=softTex(1), cloudTex=softTex(9);

const L=(o)=>new THREE.MeshLambertMaterial(o);
const M={
  woodTower:L({map:rep(woodTex,2,2.5)}),
  woodSmall:L({map:rep(woodTex,1,1)}),
  log:L({map:rep(woodTex,1,1.4),color:0xd8d0c4}),
  plank:L({map:rep(woodTex,1,1),color:0xc8bfb2}),
  daub:L({map:rep(daubTex,1,1)}),
  thatch:L({map:rep(thatchTex,.32,.32),side:THREE.DoubleSide}),
  shingle:L({map:rep(shingleTex,3,2)}),
  stone:L({map:rep(stoneTex,3,1)}),
  dark:L({color:0x1d140c}),
  water:new THREE.MeshPhongMaterial({color:0x4f6f78,shininess:80,specular:0x99aabb}),
  hay:L({map:rep(thatchTex,1,1),color:0xe0c27a}),
};

/* ---------- terrain (polar mesh: dense near the fort, coarse far away) ---------- */
const terrainColors={};
let terrain;
{
  const N=210,A=288,RMAX=1300;
  const vc=(N+1)*(A+1);
  const pos=new Float32Array(vc*3),nor=new Float32Array(vc*3),uv=new Float32Array(vc*2),cP=new Float32Array(vc*3),cT=new Float32Array(vc*3);
  const C=h=>new THREE.Color(h);
  const DRY=C(0xa99a5c),DIRT=C(0x7c6343),EARTH=C(0x9c8866),PATH=C(0xa48f6c),tmp=new THREE.Color();
  const FIELDS=[0x8a9a4a,0xb9a962,0x6f8a3e,0xc7b77a,0x7f7452,0x5f7d3a,0x9aa95a].map(C);
  let k=0;
  for(let i=0;i<=N;i++){
    const r=RMAX*Math.pow(i/N,2.2);
    for(let j=0;j<=A;j++){
      const a=j/A*Math.PI*2, x=Math.sin(a)*r, z=-Math.cos(a)*r, y=H(x,z);
      pos[k*3]=x;pos[k*3+1]=y;pos[k*3+2]=z;
      const e=.6, dx=(H(x+e,z)-H(x-e,z))/(2*e), dz=(H(x,z+e)-H(x,z-e))/(2*e);
      const nl=Math.hypot(dx,1,dz);nor[k*3]=-dx/nl;nor[k*3+1]=1/nl;nor[k*3+2]=-dz/nl;
      uv[k*2]=x/5;uv[k*2+1]=z/5;
      const n=fbm(x*.04,z*.04), n2=vnoise(x*.5+9,z*.5+2);
      const g=new THREE.Color().setHSL(.2+n*.06,.36+n*.1,.27+n2*.06);
      g.lerp(DRY,clamp((fbm(x*.02+20,z*.02-5)-.42)*1.5,0,.55));
      const sl=Math.hypot(dx,dz);
      g.lerp(DIRT,ss(.45,1.1,sl)*.5*(.6+n2*.4)*(r<70?1:.3));
      if(r>230){const fx=x*.8+z*.6,fz=-x*.6+z*.8;const fc=FIELDS[Math.floor(hash(Math.floor(fx/70),Math.floor(fz/45))*FIELDS.length)];

/* auto-oriented triangle soup -> geometry (normals point away from 'center') */
function triGeo(tris,center,uvFn){
  const p=[],u=[],a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3(),n=new THREE.Vector3(),cen=new THREE.Vector3();
  for(const t of tris){a.fromArray(t[0]);b.fromArray(t[1]);c.fromArray(t[2]);
    n.subVectors(b,a).cross(c.clone().sub(a));cen.copy(a).add(b).add(c).divideScalar(3).sub(center);
    const order=n.dot(cen)<0?[t[0],t[2],t[1]]:t;
    for(const v of order){p.push(...v);u.push(...uvFn(v,t));}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(u,2));g.computeVertexNormals();return g;}
function hipRoofGeo(Lr,W,Hr,ov,ridge){
  const l=Lr/2+ov,w=W/2+ov,rl=l*ridge;
  const P=[[-l,0,-w],[l,0,-w],[l,0,w],[-l,0,w],[-rl,Hr,0],[rl,Hr,0]];
  const tris=[[P[0],P[1],P[5]],[P[0],P[5],P[4]],[P[2],P[3],P[4]],[P[2],P[4],P[5]],[P[3],P[0],P[4]],[P[1],P[2],P[5]]];
  return triGeo(tris,new THREE.Vector3(0,Hr*.3,0),(v,t)=>{const endFace=t.every(q=>Math.sign(q[0])===Math.sign(t[0][0]));
    return [endFace?v[2]:v[0],v[1]*1.4];});
}

      const sc=1+t*5;s.sp.scale.set(sc,sc,1);s.sp.material.opacity=.32*(1-t)*Math.min(1,t*6);}
    const f=window.__flag;if(f){const pa=f.geometry.attributes.position;
      for(let i=0;i<pa.count;i++){const x=pa.getX(i);pa.setZ(i,Math.sin(x*2.3-time*5)*.16*(x/2.6)+Math.sin(x*4.1-time*7.3)*.04*x);}pa.needsUpdate=true;}
  }
  for(const c of clouds){c.position.x+=dt*3;if(c.position.x>1200)c.position.x=-1200;}

  // compass
  if(walking){tmpV.set(-Math.sin(yaw),0,-Math.cos(yaw));}else{tmpV.subVectors(controls.target,camera.position);}
  const bear=Math.atan2(tmpV.x,-tmpV.z)/D2R;needle.style.transform=`rotate(${-bear}deg)`;

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

go(0);
camera.position.copy(STOPS[0].p).add(V(-40,30,50));
flyTo(STOPS[0].p.clone(),STOPS[0].g.clone(),2600);
requestAnimationFrame(t=>{last=t;frame(t);setTimeout(()=>$('#loader').classList.add('gone'),150);});
})();
</script>
